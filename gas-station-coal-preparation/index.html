<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>煤气站煤制备标准作业视频</title>
  <style>
    html,body{margin:0;min-height:100%;background:#000;color:#fff;font-family:system-ui,"Microsoft YaHei",sans-serif}
    main{min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center}
    video{width:100%;max-height:calc(100vh - 60px);background:#000}
    h1{font-size:18px;font-weight:600;margin:14px 12px 18px;text-align:center}
  </style>
</head>
<body>
  <main>
    <video id="video" controls playsinline preload="metadata"></video>
    <h1>煤气站煤制备标准作业视频</h1>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <script>
    const video = document.getElementById('video');
    const source = 'playlist.m3u8';
    if (video.canPlayType('application/vnd.apple.mpegurl')) {
      video.src = source;
    } else if (Hls.isSupported()) {
      const hls = new Hls();
      hls.loadSource(source);
      hls.attachMedia(video);
    }
  </script>
</body>
</html>
